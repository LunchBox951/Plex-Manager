<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plex Manager - Welcome</title>
    <link rel="stylesheet" href="/static/css/landing.css">
</head>
<body>
    <div class="container">
        <div class="hero">
            <div class="logo">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="80" height="80">
                    <circle cx="100" cy="100" r="90" fill="#E5A00D"/>
                    <path d="M100 40 L160 100 L100 160 L40 100 Z" fill="#282A2D"/>
                </svg>
            </div>
            
            <h1>Welcome to Plex Manager</h1>
            <p class="subtitle">Your unified media request and automation system</p>
            
            <div class="cta">
                <button class="plex-login-btn" onclick="openPlexLogin()">
                    <svg class="plex-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30" width="24" height="24">
                        <path fill="#E5A00D" d="M 15 3 C 8.373 3 3 8.373 3 15 C 3 21.627 8.373 27 15 27 C 21.627 27 27 21.627 27 15 C 27 8.373 21.627 3 15 3 z M 15 5 C 20.535 5 25 9.465 25 15 C 25 20.535 20.535 25 15 25 C 9.465 25 5 20.535 5 15 C 5 9.465 9.465 5 15 5 z M 12 10 L 12 20 L 18 15 L 12 10 z"/>
                    </svg>
                    Sign in with Plex
                </button>
                <p class="login-note">Sign in with your Plex account to get started</p>
            </div>
        </div>
    </div>
    
    <script>
        // Store current PIN ID globally so popup can access it
        let currentPinId = null;
        
        // Listen for messages from the auth success popup
        window.addEventListener('message', async (event) => {
            console.log('Received message from:', event.origin, 'Data:', event.data);
            
            // Verify message origin for security (must be same origin)
            if (event.origin !== window.location.origin) {
                console.warn('Ignoring message from unexpected origin:', event.origin, 'Expected:', window.location.origin);
                return;
            }
            
            // Check if this is our auth success message
            if (event.data && event.data.type === 'plex_auth_success') {
                console.log('Received auth success message:', event.data);
                const pinId = event.data.pinId;
                
                try {
                    // Poll the PIN endpoint once to get the token
                    console.log('Polling for token with PIN ID:', pinId);
                    const response = await fetch(`/api/auth/poll/${pinId}`, { 
                        credentials: 'include' 
                    });
                    
                    if (!response.ok) {
                        alert('Failed to complete authentication. Please try again.');
                        return;
                    }
                    
                    const data = await response.json();
                    console.log('Poll response:', data);
                    
                    if (data.status === 'success') {
                        console.log('Authentication successful! Token received.');
                        
                        // Set cookie via callback
                        console.log('Setting session cookie...');
                        const callbackResponse = await fetch(`/auth/callback?token=${data.token}`, {
                            credentials: 'include'
                        });
                        
                        console.log('Callback response status:', callbackResponse.status);
                        
                        if (!callbackResponse.ok) {
                            const errorText = await callbackResponse.text();
                            console.error('Failed to set session cookie:', errorText);
                            alert('Failed to set session cookie');
                            return;
                        }
                        
                        const callbackData = await callbackResponse.json();
                        console.log('Callback data:', callbackData);
                        
                        // Redirect to home page
                        console.log('Authentication complete, redirecting to home...');
                        window.location.href = '/home';
                    } else if (data.status === 'error') {
                        alert('Authentication failed: ' + (data.message || 'Unknown error'));
                    } else {
                        alert('Authentication is still pending. Please complete the login on Plex.');
                    }
                } catch (error) {
                    console.error('Error completing authentication:', error);
                    alert('Failed to complete authentication. Please try again.');
                }
            }
        });
        
        async function openPlexLogin() {
            try {
                // First, get the PIN from the backend
                console.log('Getting Plex PIN...');
                const pinResponse = await fetch('/api/auth/start');
                if (!pinResponse.ok) {
                    alert('Failed to start authentication. Please try again.');
                    return;
                }
                
                const pinData = await pinResponse.json();
                currentPinId = pinData.pin_id;
                const authUrl = pinData.auth_url;
                
                console.log('Got PIN ID:', currentPinId);
                
                // Open popup to Plex auth URL
                const width = 600;
                const height = 700;
                const left = (window.screen.width - width) / 2;
                const top = (window.screen.height - height) / 2;
                
                const popup = window.open(
                    authUrl,
                    'Plex Login',
                    `width=${width},height=${height},left=${left},top=${top},toolbar=no,location=no,status=no,menubar=no,resizable=yes`
                );
                
                if (!popup || popup.closed || typeof popup.closed === 'undefined') {
                    alert('Popup blocked! Please allow popups for this site and try again.');
                    return;
                }
                
                console.log('Popup opened, waiting for auth success message...');
                
            } catch (error) {
                console.error('Error starting auth:', error);
                alert('Failed to start authentication. Please try again.');
            }
        }
    </script>
</body>
</html>
